name: Browser game checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check game source
        run: node --check src/oyun.js
      - name: Syntax check vendored graphics engine
        run: node --check vendor/three-r128.js
      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: Build playable offline HTML from repository sources
        run: python3 tools/build_offline.py --out dist/KillTheKing_Oyna.html
      - name: Validate all inlined HTML scripts
        run: node tools/check_offline.cjs dist/KillTheKing_Oyna.html
      - name: Test source provenance metadata
        run: python3 -m unittest discover -s tools/g8-5c -p 'test_g8_5i_ci_build_manifest.py'
      - name: Write immutable game artifact provenance
        run: python3 tools/g8-5c/g8_5i_ci_build_manifest.py --html dist/KillTheKing_Oyna.html --output dist/KillTheKing_Build_Provenance.json
      - name: Upload tested repository baseline (NOT verified G8.4)
        uses: actions/upload-artifact@v4
        with:
          name: killtheking-repo-build-unverified-G8_4-${{ github.sha }}
          path: |
            dist/KillTheKing_Oyna.html
            dist/KillTheKing_Build_Provenance.json
          if-no-files-found: error
