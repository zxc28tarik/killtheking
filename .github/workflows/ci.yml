name: Browser game checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a current main-based development branch
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check game source
        run: node --check src/oyun.js
      - name: Syntax check vendored graphics engine
        run: node --check vendor/three-r128.js
      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: Build playable offline HTML from repository sources
        run: python3 tools/build_offline.py --out dist/KillTheKing_Oyna.html
      - name: Validate all inlined HTML scripts
        run: node tools/check_offline.cjs dist/KillTheKing_Oyna.html
      - name: Assert main/root index and downloadable artifact are the same CANONICAL game
        run: |
          node tools/sync_canonical_entrypoint.mjs --check
          cmp index.html dist/KillTheKing_Oyna.html
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const s=readFileSync("dist/KillTheKing_Oyna.html","utf8");
            if(!s.includes("id=\"native-siege-start\"")||
               !s.includes("ktkNativeSiegeMapStatus")||
               !s.includes("id=\"ktk-ui32-controller\"")||
               s.includes("ktk-source-siege")||
               s.includes("data-ktk-launch="))
              throw Error("Old isolated S3D1 game accidentally exported");
            console.log("PASS: single original game, 3 maps, no S3D1 iframe");
          '
      - name: Upload tested playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: KillTheKing-CURRENT-PLAYABLE
          path: dist/KillTheKing_Oyna.html
          if-no-files-found: error
