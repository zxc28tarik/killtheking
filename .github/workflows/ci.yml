name: Browser game checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check game source
        run: node --check src/oyun.js
      - name: Syntax check vendored graphics engine
        run: node --check vendor/three-r128.js
      - name: Regression tests
        run: node --test tests/*.test.mjs

      - name: Build playable offline HTML from repository sources
        run: python3 tools/build_offline.py --out dist/KillTheKing_Oyna.html
      - name: Validate all inlined HTML scripts
        run: node tools/check_offline.cjs dist/KillTheKing_Oyna.html
      - name: Upload tested playable HTML
        uses: actions/upload-artifact@v4
        with:
          name: killtheking-playable-html
          path: dist/KillTheKing_Oyna.html
          if-no-files-found: error
