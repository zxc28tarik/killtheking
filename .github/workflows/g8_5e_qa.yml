name: G8.5C-F isolated QA
on:
  pull_request:
    paths:
      - 'tools/g8-5c/**'
      - '.github/workflows/g8_5e_qa.yml'
  push:
    branches:
      - 'codex/g8-5c-telemetry-mirror-qa'
    paths:
      - 'tools/g8-5c/**'
      - '.github/workflows/g8_5e_qa.yml'
jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check all isolated Node modules
        run: |
          for file in tools/g8-5c/*.mjs; do node --check "$file"; done
      - name: Run all independent Node QA tests
        working-directory: tools/g8-5c
        run: |
          for file in test_*.mjs; do
            echo "Running $file"
            node "$file"
          done
      - name: Run read-only source recovery gate tests
        working-directory: tools/g8-5c
        run: python3 test_g8_5f_source_gate.py
