name: OPT-A map-specific bottleneck profiles
on:
  push:
    branches: [main]
    paths: ['.github/workflows/opt_map_profiles.yml','qa/opt_map_profile.mjs']
  workflow_dispatch:
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        map: [arena, meadow, siege]
        width: [960, 1920]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KTK_MAP: ${{ matrix.map }}
      KTK_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node qa/opt_map_profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt-profile-${{ matrix.map }}-${{ matrix.width }}
          path: opt-profile-*.json
          if-no-files-found: warn
