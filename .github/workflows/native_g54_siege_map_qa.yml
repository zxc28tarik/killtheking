name: "AK-NATIVE-09 — original Kill the King G5.4 siege and menu regression"
on:
  push:
    branches:
      - codex/native-g54-siege-map-phase2
    paths:
      - "recovered/native-siege/**"
      - ".github/workflows/native_g54_siege_map_qa.yml"
  workflow_dispatch:
jobs:
  native-g54-siege:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: AK06 original game baseline
        run: node --test recovered/native-siege/test_ak_native_06.mjs
      - name: AK07 original game physical siege logic
        run: node --test recovered/native-siege/test_ak_native_07.mjs
      - name: AK08 original game real-GL HUD invariants
        run: node --test recovered/native-siege/test_ak_native_08.mjs
      - name: AK09 original three-map mode isolation, 140 native actors and compact HUD
        run: node --test recovered/native-siege/test_ak_native_09.mjs
