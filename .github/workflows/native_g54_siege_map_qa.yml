name: "AK-NATIVE-08 — original G5.4 siege map regression"
on:
  push:
    branches:
      - codex/native-g54-siege-map-phase2
    paths:
      - "recovered/native-siege/**"
      - ".github/workflows/native_g54_siege_map_qa.yml"
  workflow_dispatch:
jobs:
  native-g54-siege:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: AK06 historical original engine and soldier regression
        run: node --test recovered/native-siege/test_ak_native_06.mjs
      - name: AK07 original physical projectile / squad authority regression
        run: node --test recovered/native-siege/test_ak_native_07.mjs
      - name: AK08 original 28 scripts and siege-only compact HUD regression
        run: node --test recovered/native-siege/test_ak_native_08.mjs
