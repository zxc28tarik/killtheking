name: OPT-16 Arena shader prewarm A/B
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opt16_shader_ab.yml'
      - 'qa/opt16_shader_ab.mjs'
      - 'tests/opt16-shader-ab-integrity.test.mjs'
  workflow_dispatch:
concurrency:
  group: opt16-shader-main
  cancel-in-progress: true
jobs:
  shader-ab:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arm: [cold, prewarm]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      KTK_SHADER_ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/opt16-shader-ab-integrity.test.mjs
      - run: node qa/opt16_shader_ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt16-shader-ab-${{ matrix.arm }}
          path: opt16-shader-ab-*.json
          if-no-files-found: warn
