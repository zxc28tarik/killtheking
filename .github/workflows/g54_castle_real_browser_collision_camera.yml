name: Kill the King - castle real Chromium collision camera and RAF (software WebGL)
on:
  push:
    branches:
      - codex/g54-ffa-army-isolated-launcher
    paths:
      - 'recovered/army/integration/browser_castle_collision_camera_render.mjs'
      - 'recovered/army/integration/player_target_hotfix.mjs'
      - 'recovered/army/integration/build_isolated_launcher.mjs'
      - '.github/workflows/g54_castle_real_browser_collision_camera.yml'
  workflow_dispatch:
jobs:
  castle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Checkout immutable October FFA source
        uses: actions/checkout@v4
        with:
          ref: codex/a5-meadow-twentyfold-area
          path: ffa-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check real-browser input and geometry test syntax
        run: node --check recovered/army/integration/browser_castle_collision_camera_render.mjs
      - name: Build and verify deterministic arena-only-0.5s candidate
        run: |
          python3 ffa-source/tools/build_offline.py --out dist/KillTheKing_Oyna.html
          echo '18dca2a895763f0955566f2fc90651f1ab1a98f86597e399cbac42ac2fc6f15a  ffa-source/dist/KillTheKing_Oyna.html' | sha256sum --check -
          node recovered/army/integration/build_isolated_launcher.mjs ffa-source/dist/KillTheKing_Oyna.html recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html
          echo '6e5cd25ac217d032a190d499c1fb2aac61c5cff1d2a280793caab894c6448ded  recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html' | sha256sum --check -
      - name: Install pinned Playwright and Chromium software WebGL
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Real player keyboard camera pointer lock castle walls and live RAF
        env:
          KTK_BROWSER_REPORT_DIR: recovered/army/integration/browser-evidence-castle
        run: |
          node recovered/army/integration/browser_castle_collision_camera_render.mjs recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html
      - name: Archive actual Chromium input/render/scene-collider evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KillTheKing-Castle-Real-Browser-Software-WebGL-Collision-Camera-NOT-GPU-ACCEPTANCE
          path: |
            recovered/army/integration/browser-evidence-castle/
            recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html.build.json
          if-no-files-found: warn
