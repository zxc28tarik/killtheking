name: UI32 full-screen menu acceptance
on:
  push:
    branches: [main, 'codex/fit*', codex/ui32-native-fullscreen-menu-flow]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Exercise map and class selection, start, and menu visibility
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import assert from 'node:assert/strict';
          assert.deepEqual(readFileSync('index.html'),readFileSync('playables/KillTheKing_AK30_Amblemler_Korundu_Tam_Ekran_Arka_Plan.html'));
          const b=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try {
            for(const viewport of [{width:1920,height:1080},{width:1366,height:768},{width:390,height:844}]){
              const p=await b.newPage({viewport}); const errors=[]; p.on('pageerror',e=>errors.push(e.message));
              await p.goto(pathToFileURL(resolve('index.html')).href);
              await p.waitForFunction(()=>window.ktkUI32Status?.().ready==='true');
              const status=await p.evaluate(()=>window.ktkUI32Status());
              assert.equal(await p.locator('[data-focus-class]').count(),0,'obsolete duplicate class controls');
              assert.equal(status.legacyHidden,true);assert.equal(status.stage,'map');assert.equal(status.mapEmblems,3);assert.equal(status.classes,4);
              const box=await p.locator('#menu-overlay').boundingBox();assert.ok(Math.abs(box.width-viewport.width)<2);
              await p.screenshot({path:'ui32-map-'+viewport.width+'.png',timeout:90000});
              for(const map of ['arena','meadow','siege','meadow','arena']){
                await p.locator('[data-focus-map="'+map+'"]').click();
                assert.equal(await p.evaluate(()=>window.ktkUI32Status().stage),'class');
                const selected=await p.evaluate(()=>window.ktkUI32Status());
                assert.equal(selected.selectedMap,map);assert.equal(selected.engineSiege,map==='siege');assert.equal(selected.engineArmy,map!=='arena');assert.equal(selected.engineMap,map==='meadow'?'meadow':'castle');
                console.log('PASS actual map state',viewport.width,map);
                for(const id of [0,1,2,3]){
                  await p.locator('[data-approved-class="'+id+'"]:visible').click();
                  assert.equal(await p.evaluate(()=>window.ktkApprovedArtworkStatus().currentClass),String(id));
                }
                await p.screenshot({path:'ui32-class-'+viewport.width+'-'+map+'.png',timeout:90000});
                await p.locator('#ui32-back').click();
              }
              // FIT02c: old class cards are no longer runtime dependencies.
              assert.equal(await p.locator('#ktk-original-menu .class-card').count(),0);
              for(const id of [0,1,2,3]){
                await p.evaluate(id=>window.selectClass(id),id);
                const state=await p.evaluate(()=>{
                  const buttons=[...document.querySelectorAll('#focus-menu [data-approved-class]')];
                  return {total:buttons.length,selected:buttons.filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>Number(b.dataset.approvedClass))};
                });
                assert.equal(state.total,8,'four desktop and four mobile class buttons');
                assert.deepEqual(state.selected,[id,id],'both layouts reflect exactly the same selected class');
              }
              console.log('PASS direct engine class sync without old cards',viewport.width);
              // FIT02b: settings must still reach the original engine controls.
              await p.locator('[data-focus-map="arena"]').click();
              await p.locator('#fm-toggle-settings').click();
              await p.locator('[data-focus-mode="tdm"]').click();
              assert.equal(await p.locator('[data-arena-mode="tdm"]').getAttribute('aria-pressed'),'true');
              await p.locator('[data-focus-mode="ffa"]').click();
              await p.locator('[data-focus-duration="120"]').click();
              assert.equal(await p.locator('[data-duration-seconds="120"]').getAttribute('aria-pressed'),'true');
              await p.locator('#fm-quality').selectOption('low');
              assert.equal(await p.locator('#arena-quality-select').inputValue(),'low');
              await p.locator('#fm-low-motion').check();
              assert.equal(await p.locator('#arena-low-motion').isChecked(),true);
              const writes=await p.evaluate(()=>{
                const obs=new MutationObserver(()=>{});
                obs.observe(document.getElementById('focus-menu'),{attributes:true,childList:true,characterData:true,subtree:true});
                for(let i=0;i<5;i++)window.ktkSyncFocusMenu();
                const count=obs.takeRecords().length;obs.disconnect();return count;
              });
              assert.equal(writes,0,'unchanged menu sync must not mutate the DOM');
              await p.locator('#ui32-back').click();
              console.log('PASS settings bridge and idempotent sync',viewport.width);
              const startMap=viewport.width===1920?'arena':viewport.width===1366?'meadow':'siege';
              await p.locator('[data-focus-map="'+startMap+'"]').click();
              await p.locator('#play-btn').click();
              await p.waitForFunction(()=>window.ktkUI32Status().menuHidden);
              const started=await p.evaluate(()=>window.ktkUI32Status());
              assert.equal(started.phase,'playing');assert.equal(started.engineSiege,startMap==='siege');assert.equal(started.engineArmy,startMap!=='arena');
              console.log('PASS actual match start',startMap);
              assert.deepEqual(errors,[]);
              console.log('PASS start and menu visibility',viewport.width);
              await p.close();
            }
          } finally {await b.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI32-browser-evidence
          path: ui32-*.png
          if-no-files-found: warn
