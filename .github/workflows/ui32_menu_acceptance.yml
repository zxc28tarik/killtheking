name: UI32 full-screen menu acceptance
on:
  push:
    branches: [main, 'codex/fit*', codex/ui32-native-fullscreen-menu-flow]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Exercise map and class selection, start, and menu visibility
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { resolve } from 'node:path';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import assert from 'node:assert/strict';
          assert.deepEqual(readFileSync('index.html'),readFileSync('playables/KillTheKing_AK30_Amblemler_Korundu_Tam_Ekran_Arka_Plan.html'));
          const b=await chromium.launch({args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try {
            for(const viewport of [{width:1920,height:1080},{width:1366,height:768},{width:390,height:844}]){
              const p=await b.newPage({viewport}); const errors=[]; p.on('pageerror',e=>errors.push(e.message));
              await p.goto(pathToFileURL(resolve('index.html')).href);
              try {
                await p.waitForFunction(()=>window.ktkUI32Status?.().ready==='true',null,{timeout:30000});
              } catch(error) {
                console.error('REC03_BOOT_DIAGNOSTICS',JSON.stringify({errors,state:await p.evaluate(()=>({ready:document.readyState,three:typeof THREE,ui:typeof window.ktkUI32Status,overlay:document.getElementById('menu-overlay')?.dataset.ui32Ready??null,scripts:document.scripts.length}))}));
                await p.screenshot({path:'ui32-boot-failure-'+viewport.width+'.png',timeout:90000}).catch(()=>{});
                throw error;
              }
              const status=await p.evaluate(()=>window.ktkUI32Status());
              assert.equal(await p.locator('[data-focus-class]').count(),0,'obsolete duplicate class controls');
              assert.equal(status.legacyHidden,true);assert.equal(status.stage,'map');assert.equal(status.mapEmblems,3);assert.equal(status.classes,4);
              const box=await p.locator('#menu-overlay').boundingBox();assert.ok(Math.abs(box.width-viewport.width)<2);
              await p.screenshot({path:'ui32-map-'+viewport.width+'.png',timeout:90000});
              for(const map of ['arena','meadow','siege','meadow','arena']){
                await p.locator('[data-focus-map="'+map+'"]').click();
                assert.equal(await p.evaluate(()=>window.ktkUI32Status().stage),'class');
                const selected=await p.evaluate(()=>window.ktkUI32Status());
                assert.equal(selected.selectedMap,map);assert.equal(selected.engineSiege,map==='siege');assert.equal(selected.engineArmy,map!=='arena');assert.equal(selected.engineMap,map==='meadow'?'meadow':'castle');
                console.log('PASS actual map state',viewport.width,map);
                // REC02: actual atmosphere transitions preserve exact gradient and release old maps.
                const skyCheck=await p.evaluate(()=>{
                  const original=currentAtmosphereIdx;
                  let replaced=0,disposed=0,reused=0,wrong=0;
                  try{
                    for(const idx of [0,1,2,0]){
                      const before=skyDomeMesh.material.map;
                      let freed=0;const listener=()=>freed++;
                      before.addEventListener('dispose',listener);
                      window.setAtmosphere(idx);
                      before.removeEventListener('dispose',listener);
                      const active=skyDomeMesh.material.map;
                      if(active!==before){replaced++;disposed+=freed;}else if(freed)wrong++;
                      const preset=window.__ktkMeadowLightActive?KTKMeadowNaturalLighting.PRESETS[idx]:ATMOSPHERES[idx];
                      const key=JSON.stringify(window.__ktkMeadowLightActive?[preset.top,preset.mid,preset.horizon]:[preset.topCol,preset.midCol,preset.botCol]);
                      if(active.userData.ktkGradientKey!==key)wrong++;
                      window.setAtmosphere(idx);
                      if(skyDomeMesh.material.map===active)reused++;
                    }
                    return {replaced,disposed,reused,wrong};
                  }finally{window.setAtmosphere(original);}
                });
                assert.ok(skyCheck.replaced>=3);
                assert.equal(skyCheck.replaced,skyCheck.disposed);
                assert.equal(skyCheck.reused,4);
                assert.equal(skyCheck.wrong,0);
                // AK31: check physical third-map collider/raycast registration in REAL Chromium.
                const siegeInterior=await p.evaluate(()=>window.ktkSiegeInteriorStatus?.());
                assert.ok(siegeInterior,'AK31 status missing in current native game');
                assert.equal(siegeInterior.installed,true);
                assert.equal(siegeInterior.activated,map==='siege');
                assert.equal(siegeInterior.collisionBlocks,34);
                assert.equal(siegeInterior.wallPosts,16);
                assert.equal(siegeInterior.openGuardroomWalls,6);
                assert.equal(siegeInterior.physicalProjectileCover,map==='siege');
                if(map==='siege')
                  assert.ok(Object.values(siegeInterior.corridors).every(Boolean),'AK31 breached a real assault lane');
                for(const id of [0,1,2,3]){
                  await p.locator('[data-approved-class="'+id+'"]:visible').click();
                  assert.equal(await p.evaluate(()=>window.ktkApprovedArtworkStatus().currentClass),String(id));
                }
                await p.screenshot({path:'ui32-class-'+viewport.width+'-'+map+'.png',timeout:90000});
                await p.locator('#ui32-back').click();
              }
              // FIT02c: old class cards are no longer runtime dependencies.
              assert.equal(await p.locator('#ktk-original-menu .class-card').count(),0);
              for(const id of [0,1,2,3]){
                await p.evaluate(id=>window.selectClass(id),id);
                const state=await p.evaluate(()=>{
                  const buttons=[...document.querySelectorAll('#focus-menu [data-approved-class]')];
                  return {total:buttons.length,selected:buttons.filter(b=>b.getAttribute('aria-pressed')==='true').map(b=>Number(b.dataset.approvedClass))};
                });
                assert.equal(state.total,8,'four desktop and four mobile class buttons');
                assert.deepEqual(state.selected,[id,id],'both layouts reflect exactly the same selected class');
              }
              console.log('PASS direct engine class sync without old cards',viewport.width);
              // FIT03a: stable HUD values must not cause DOM mutations or replace the weapon SVG.
              const hudCheck=await p.evaluate(()=>{
                const ids=['hud-hp-text','hud-hp-bar','hud-class-name','hud-class-tip','hud-weapon-icon','hud-ammo','hud-ability-badge','hud-kills','hud-deaths','hud-streak','hud-timer','hud-speed'];
                const nodes=ids.map(id=>document.getElementById(id));
                window.selectClass(0);
                updateHUD();
                const icon=document.getElementById('hud-weapon-icon'),first=icon.firstElementChild,markup=icon.innerHTML;
                const observer=new MutationObserver(()=>{});
                for(const el of nodes)observer.observe(el,{attributes:true,childList:true,characterData:true,subtree:true});
                for(let i=0;i<10;i++)updateHUD();
                const stable=observer.takeRecords().length;
                const sameNode=first===icon.firstElementChild;
                window.selectClass(3);
                const changed=icon.innerHTML!==markup;
                const detached=document.createElement('span');
                setHudText(detached,0);setHudClass(detached,'initial');
                const probe=new MutationObserver(()=>{});
                probe.observe(detached,{attributes:true,childList:true,characterData:true,subtree:true});
                setHudText(detached,0);setHudClass(detached,'initial');
                const repeated=probe.takeRecords().length;
                setHudText(detached,1);setHudClass(detached,'next');
                const updated=detached.textContent==='1'&&detached.className==='next';
                probe.disconnect();observer.disconnect();
                return {stable,sameNode,changed,repeated,updated};
              });
              assert.deepEqual(hudCheck,{stable:0,sameNode:true,changed:true,repeated:0,updated:true});
              console.log('PASS FIT03a HUD unchanged writes and real class changes',viewport.width);
              // FIT03b: test actual Three.js disposal events and shared ownership.
              const resourceCheck=await p.evaluate(()=>{
                let particleGeometry=0,particleMaterial=0,arrowGeometry=0,sharedMaterial=0,helmetGeometry=0,helmetMaterial=0;
                const origin=new THREE.Vector3(0,5,0),dir=new THREE.Vector3(1,0,0);
                clearRoundTransients();
                // Empty enough slots so all five particles can be returned without overflow.
                const held=[];
                while(effectMeshPools.lambert.length)held.push(effectMeshPools.lambert.pop());
                const initial=particles.length;
                spawnSmokeCloud(origin,dir,5);
                const smoke=particles.slice(initial);
                for(const p of smoke){
                  p.mesh.geometry.addEventListener('dispose',()=>particleGeometry++);
                  p.mesh.material.addEventListener('dispose',()=>particleMaterial++);
                }
                const arrow=new THREE.Group(),shared=new THREE.MeshBasicMaterial();
                shared.addEventListener('dispose',()=>sharedMaterial++);
                for(let i=0;i<2;i++){
                  const g=new THREE.BoxGeometry(1,1,1);
                  g.addEventListener('dispose',()=>arrowGeometry++);
                  arrow.add(new THREE.Mesh(g,shared));
                }
                scene.add(arrow);arrows.push({mesh:arrow});
                const stuck=new THREE.Group(),g=new THREE.BoxGeometry(1,1,1);
                g.addEventListener('dispose',()=>arrowGeometry++);
                stuck.add(new THREE.Mesh(g,shared));scene.add(stuck);stuckArrows.push({mesh:stuck});
                const hg=new THREE.BoxGeometry(1,1,1),hm=new THREE.MeshBasicMaterial();
                hg.addEventListener('dispose',()=>helmetGeometry++);
                hm.addEventListener('dispose',()=>helmetMaterial++);
                const helmet=new THREE.Mesh(hg,hm);
                scene.add(helmet);flyingHelmets.push({mesh:helmet});
                clearRoundTransients();clearRoundTransients();
                const result={particleGeometry,particleMaterial,arrowGeometry,sharedMaterial,helmetGeometry,helmetMaterial,
                  remaining:particles.length+arrows.length+stuckArrows.length+flyingHelmets.length,
                  detached:[...smoke.map(p=>p.mesh),arrow,stuck,helmet].every(m=>m.parent===null),
                  returned:smoke.every(p=>effectMeshPools.lambert.includes(p.mesh)),
                  sharedGeometry:smoke.every(p=>p.mesh.geometry===effectCubeGeometry)};
                spawnSmokeCloud(origin,dir,5);
                result.reused=particles.length===5&&particles.every(p=>smoke.some(q=>p.mesh===q.mesh));
                clearRoundTransients();
                for(const mesh of held)releaseParticle(mesh);
                result.bounded=effectMeshPools.lambert.length<=EFFECT_POOL_LIMIT;
                shared.dispose();hg.dispose();hm.dispose();return result;
              });
              assert.deepEqual(resourceCheck,{particleGeometry:0,particleMaterial:0,arrowGeometry:3,sharedMaterial:0,helmetGeometry:0,helmetMaterial:0,remaining:0,detached:true,returned:true,sharedGeometry:true,reused:true,bounded:true});
              console.log('PASS FIT03b owned resource disposal and shared resource protection',viewport.width);
              // FIT03c: compare old allocating ray queries and reused scratch storage.
              const sightCheck=await p.evaluate(()=>{
                const saved=worldMeshes.slice(),legacyRay=new THREE.Raycaster();
                const g=new THREE.BoxGeometry(2,6,2),m=new THREE.MeshBasicMaterial();
                const wall=new THREE.Mesh(g,m);wall.position.set(5,2,0);wall.updateMatrixWorld(true);
                let compared=0,mismatches=0,dirty=0,changedInputs=0;
                const oldBlock=(a,b)=>{
                  const d=b.clone().sub(a),length=d.length();if(length<=.15)return false;
                  legacyRay.set(a,d.multiplyScalar(1/length));legacyRay.near=.05;legacyRay.far=length-.10;
                  return legacyRay.intersectObjects(worldMeshes,false).length>0;
                };
                const oldSight=(a,b,isPlayer)=>{
                  const origin=new THREE.Vector3(a.x,a.y+1.8,a.z),end=b.clone();
                  end.y+=isPlayer?1:1.65;const d=end.sub(origin),length=d.length();
                  if(length<.01)return true;
                  legacyRay.set(origin,d.multiplyScalar(1/length));legacyRay.near=.12;legacyRay.far=Math.max(.12,length-.55);
                  return legacyRay.intersectObjects(worldMeshes,false).length===0;
                };
                const check=(actual,expected)=>{compared++;if(actual!==expected)mismatches++;if(arenaSightHits.length)dirty++;};
                try{
                  for(const meshes of [[wall],[],saved]){
                    worldMeshes.length=0;worldMeshes.push(...meshes);
                    for(let i=0;i<60;i++){
                      const a=new THREE.Vector3(0,0,i%2===0?0:10),b=new THREE.Vector3(i%3===0?.04:10,0,a.z);
                      const aa=a.clone(),bb=b.clone();
                      check(arenaWorldBlockBetween(a,b),oldBlock(a,b));
                      for(const isPlayer of [true,false]){
                        check(arenaCanSeeFrom(a,b,isPlayer),oldSight(a,b,isPlayer));
                        check(arenaLineOfSight({mesh:{position:a}},b,isPlayer),oldSight(a,b,isPlayer));
                      }
                      if(!a.equals(aa)||!b.equals(bb))changedInputs++;
                    }
                  }
                  worldMeshes.length=0;worldMeshes.push(wall);
                  const a=new THREE.Vector3(0,2,0),b=new THREE.Vector3(10,2,0);
                  const blocked=arenaWorldBlockBetween(a,b);
                  worldMeshes.length=0;
                  return {compared,mismatches,dirty,changedInputs,blocked,clear:!arenaWorldBlockBetween(a,b)};
                }finally{worldMeshes.length=0;worldMeshes.push(...saved);g.dispose();m.dispose();}
              });
              assert.deepEqual(sightCheck,{compared:900,mismatches:0,dirty:0,changedInputs:0,blocked:true,clear:true});
              console.log('PASS FIT03c sight-query equivalence',viewport.width);
              // FIT04 batch: equivalent siege slabs, reusable pose records, grass tile guard and idle canvas.
              const mapPerfCheck=await p.evaluate(()=>{
                const oldSegment=(from,to,box,pad=.65)=>{
                  let lo=0,hi=1;
                  for(const [axis,min,max] of [['x',box.minX-pad,box.maxX+pad],['z',box.minZ-pad,box.maxZ+pad]]){
                    const delta=to[axis]-from[axis],value=from[axis];
                    if(Math.abs(delta)<1e-10){if(value<min||value>max)return false;continue;}
                    const a=(min-value)/delta,b=(max-value)/delta;
                    lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));if(lo>hi)return false;
                  }
                  return lo<=hi;
                };
                let mismatches=0,compared=0;
                const box={minX:-2,maxX:2,minZ:-3,maxZ:3};
                for(let ax=-6;ax<=6;ax+=2)for(let az=-6;az<=6;az+=2)
                  for(let bx=-6;bx<=6;bx+=2)for(let bz=-6;bz<=6;bz+=2){
                    const a={x:ax,z:az},b={x:bx,z:bz};compared++;
                    if(nativeSiegeSegmentHitsBox(a,b,box)!==oldSegment(a,b,box))mismatches++;
                  }
                const units=Array.from({length:140},(_,i)=>({x:i,z:-i}));
                const buf=captureSiegePoses(units),records=buf.slice();
                units[0].x=99;
                const independent=buf[0].x===0;
                const reused=captureSiegePoses(units)===buf&&buf.every((v,i)=>v===records[i]);
                const refreshed=buf[0].x===99&&buf.length===140;
                const origClear=speedLinesCtx.clearRect;let clears=0;
                speedLinesCtx.clearRect=function(...args){clears++;return origClear.apply(this,args);};
                let idleClears,transitionClears;
                try{renderSpeedLines(0);clears=0;renderSpeedLines(0);renderSpeedLines(100);idleClears=clears;
                  renderSpeedLines(160);renderSpeedLines(0);renderSpeedLines(0);transitionClears=clears;
                }finally{speedLinesCtx.clearRect=origClear;}
                const grassSkipped=arenaMap!=='meadow'?updateActiveMeadowGrass()===false:true;
                return {compared,mismatches,independent,reused,refreshed,idleClears,transitionClears,grassSkipped};
              });
              assert.deepEqual(mapPerfCheck,{compared:2401,mismatches:0,independent:true,reused:true,refreshed:true,idleClears:0,transitionClears:1,grassSkipped:true});
              console.log('PASS FIT04 batch geometry, pose reuse and idle canvas',viewport.width);
              // FIT02b: settings must still reach the original engine controls.
              await p.locator('[data-focus-map="arena"]').click();
              await p.locator('#fm-toggle-settings').click();
              await p.locator('[data-focus-mode="tdm"]').click();
              assert.equal(await p.locator('[data-arena-mode="tdm"]').getAttribute('aria-pressed'),'true');
              await p.locator('[data-focus-mode="ffa"]').click();
              await p.locator('[data-focus-duration="120"]').click();
              assert.equal(await p.locator('[data-duration-seconds="120"]').getAttribute('aria-pressed'),'true');
              await p.locator('#fm-quality').selectOption('low');
              assert.equal(await p.locator('#arena-quality-select').inputValue(),'low');
              await p.locator('#fm-low-motion').check();
              assert.equal(await p.locator('#arena-low-motion').isChecked(),true);
              const writes=await p.evaluate(()=>{
                const obs=new MutationObserver(()=>{});
                obs.observe(document.getElementById('focus-menu'),{attributes:true,childList:true,characterData:true,subtree:true});
                for(let i=0;i<5;i++)window.ktkSyncFocusMenu();
                const count=obs.takeRecords().length;obs.disconnect();return count;
              });
              assert.equal(writes,0,'unchanged menu sync must not mutate the DOM');
              await p.locator('#ui32-back').click();
              console.log('PASS settings bridge and idempotent sync',viewport.width);
              const startMap=viewport.width===1920?'arena':viewport.width===1366?'meadow':'siege';
              await p.locator('[data-focus-map="'+startMap+'"]').click();
              await p.locator('#play-btn').click();
              await p.waitForFunction(()=>window.ktkUI32Status().menuHidden);
              const started=await p.evaluate(()=>window.ktkUI32Status());
              assert.equal(started.phase,'playing');assert.equal(started.engineSiege,startMap==='siege');assert.equal(started.engineArmy,startMap!=='arena');
              console.log('PASS actual match start',startMap);
              // FIT09: verify actual running simulation, not only the menu transition.
              // Software WebGL sample is diagnostic, never a hardware FPS gate.
              const live=await p.evaluate(async()=>{
                const initial=arenaClock,armyBefore=meadowBattleState?.tick??null;
                const frames=[];let previous=performance.now();
                for(let i=0;i<12;i++){
                  await new Promise(requestAnimationFrame);
                  const now=performance.now();frames.push(now-previous);previous=now;
                }
                return {advanced:arenaClock>initial,armyBefore,armyAfter:meadowBattleState?.tick??null,
                  frames,phase:arenaMatch.phase,report:window.krunkerPerformanceReport()};
              });
              assert.equal(live.phase,'playing');assert.equal(live.advanced,true);
              if(startMap!=='arena')assert.ok(live.armyAfter>live.armyBefore,'live army simulation must progress');
              assert.ok(live.frames.every(n=>Number.isFinite(n)&&n>=0));
              console.log('FIT09 SOFTWARE_WEBGL_DIAGNOSTIC',startMap,JSON.stringify(live));
              assert.deepEqual(errors,[]);
              console.log('PASS start and menu visibility',viewport.width);
              await p.close();
            }
          } finally {await b.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI32-browser-evidence
          path: ui32-*.png
          if-no-files-found: warn
