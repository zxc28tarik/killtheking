name: Sync canonical native root index (review branch only)
on:
  push:
    branches:
      - codex/canonical-native-three-maps
      - codex/siege-long-session-acceptance
      - codex/visual-v19-native-battlefield-hud-and-landscape
      - codex/v20-native-siege-materials-and-structure
      - codex/v21-ui-renaissance-panels-hud
      - codex/v21-ui-finish-command-clarity
    paths:
      - '.github/workflows/sync_native_entrypoint.yml'
      - 'recovered/native-siege/build_canonical_three_maps.mjs'
      - 'recovered/native-siege/native-army-match-finish.js'
      - 'recovered/native-siege/native-battlefield-visual-v19.js'
      - 'recovered/native-siege/native-siege-visual-v20.js'
      - 'recovered/native-siege/native-ui-v21.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-index-sync-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  sync:
    name: Generate canonical single FPS index.html from tested source and commit on current branch
    if: github.ref_name == 'codex/canonical-native-three-maps' || github.ref_name == 'codex/siege-long-session-acceptance' || github.ref_name == 'codex/visual-v19-native-battlefield-hud-and-landscape' || github.ref_name == 'codex/v20-native-siege-materials-and-structure' || github.ref_name == 'codex/v21-ui-renaissance-panels-hud' || github.ref_name == 'codex/v21-ui-finish-command-clarity'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate root HTML (no iframe / same original FPS controls)
        run: |
          node tools/sync_canonical_entrypoint.mjs --write
          node tools/sync_canonical_entrypoint.mjs --check
          python3 tools/build_offline.py --out dist/KillTheKing_Oyna.html
          cmp -s index.html dist/KillTheKing_Oyna.html
          node tools/check_offline.cjs dist/KillTheKing_Oyna.html
      - name: Commit canonical HTML to integration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always regenerate from the CURRENT remote branch head. This
          # prevents a stale generated 1.4MB index from conflicting with
          # another in-flight CI-generated index.html change.
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          node tools/sync_canonical_entrypoint.mjs --write
          node tools/sync_canonical_entrypoint.mjs --check
          git add index.html
          if git diff --cached --quiet; then
            echo "Root index already exactly canonical"
          else
            git commit -m "build: synchronize default index.html with tested native three-map FPS"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
