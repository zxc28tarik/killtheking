name: Kill the King - S3D1 Native G5.4 Human FPS Commander
on:
  push:
    branches:
      - codex/s1-siege-castle-phase1
    paths:
      - 'recovered/siege/siege-player-locomotion.js'
      - 'recovered/siege/test_siege_player_locomotion.mjs'
      - 'recovered/siege/siege-player-combat.js'
      - 'recovered/army/modules/shared-g54-army-commands.js'
      - 'recovered/siege/test_shared_g54_army_commands.mjs'
      - 'recovered/siege/siege-rampart-ai.js'
      - 'recovered/siege/test_siege_rampart_ai.mjs'
      - 'recovered/siege/siege-defender-ai.js'
      - 'recovered/siege/test_siege_defender_ai.mjs'
      - 'recovered/siege/siege-real-army-bridge.js'
      - 'recovered/siege/siege-player-ballistics-3d.js'
      - 'recovered/siege/test_siege_player_ballistics_3d.mjs'
      - 'recovered/siege/siege-weapon-feedback.js'
      - 'recovered/siege/test_siege_weapon_feedback.mjs'
      - 'recovered/siege/siege-player-ui.js'
      - 'recovered/siege/siege-preview.js'
      - 'recovered/siege/siege-real-army-overlay.js'
      - 'recovered/siege/build_siege_player_candidate.mjs'
      - 'recovered/siege/test_siege_player_combat.mjs'
      - 'recovered/siege/browser_siege_player_smoke.mjs'
      - '.github/workflows/s3d1_siege_real_player.yml'
  workflow_dispatch:
jobs:
  source:
    name: Genuine 140 G5.4 player HP weapons and original siege regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: S3D1 source/bridge syntax check
        run: |
          node --check recovered/siege/siege-player-combat.js
          node --check recovered/siege/siege-player-ui.js
          node --check recovered/siege/siege-weapon-feedback.js
          node --check recovered/siege/siege-player-ballistics-3d.js
          node --check recovered/siege/siege-defender-ai.js
          node --check recovered/siege/siege-rampart-ai.js
          node --check recovered/siege/test_siege_rampart_ai.mjs
          node --check recovered/siege/test_siege_defender_ai.mjs
          node --check recovered/siege/test_siege_player_ballistics_3d.mjs
          node --check recovered/siege/test_siege_weapon_feedback.mjs
          node --check recovered/siege/siege-preview.js
          node --check recovered/siege/siege-player-locomotion.js
          node --check recovered/siege/test_siege_player_locomotion.mjs
          node --check recovered/siege/siege-real-army-overlay.js
          node --check recovered/army/modules/shared-g54-army-commands.js
          node --check recovered/siege/test_shared_g54_army_commands.mjs
          node --check recovered/siege/build_siege_player_candidate.mjs
          node --check recovered/siege/test_siege_player_combat.mjs
          node --check recovered/siege/browser_siege_player_smoke.mjs
      - name: Native original player HP, four weapon types, friendly body and real soldier damage
        run: |
          node --test recovered/siege/test_siege_player_combat.mjs
          node --test recovered/siege/test_siege_player_locomotion.mjs
          node --test recovered/siege/test_siege_weapon_feedback.mjs
          node --test recovered/siege/test_siege_player_ballistics_3d.mjs
          node --test recovered/siege/test_siege_defender_ai.mjs
          node --test recovered/siege/test_siege_rampart_ai.mjs
          node --test recovered/siege/test_shared_g54_army_commands.mjs
      - name: Unmodified natural S3C3, dual ladders, gate, 140 soldier and S1/S2 regression
        run: |
          node --test recovered/siege/test_siege_capture_ai.mjs
          node --test recovered/siege/test_siege_ladder_ai.mjs
          node --test recovered/siege/test_siege_structure_combat.mjs
          node --test recovered/siege/test_siege_real_army_bridge.mjs
          node --test recovered/siege/test_siege_phase1.mjs recovered/siege/test_siege_traversal.mjs
      - name: Original G5.4 source immutability
        run: |
          printf '307987855abc0973ea9177fdd659c39d1d02673c8381c0501be8b63c04ddf841  recovered/army/mirror/arena-army-battle-true-side-swap.js\n' | sha256sum --check -
      - name: Build distinct one-file offline 3D 140 soldier + real FPS human candidate
        run: |
          node recovered/siege/build_siege_player_candidate.mjs \
            recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html
          node --input-type=module -e "
          import {readFileSync} from 'node:fs';
          const p='recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html';
          const m=JSON.parse(readFileSync(p+'.build.json','utf8'));
          if(m.authenticSoldiersAndCombatEngine!==true ||
             m.genuineNativePlayerHealthAndHits!==true ||
             m.humanG54GroundWeaponDamage!==true ||
             m.originalWeaponBalancePreserved!==true ||
             m.realFPSPlayerWeaponConnected!==true ||
             m.fullOriginalFFAPlayerMovementConnected!==false ||
             m.originalFFAMovementImported!==false ||
             m.actualG54Native3DBallistics!==false ||
             m.productionSiegeApproved!==false ||
             m.mainChanged!==false)
            throw Error('S3D1 offline HTML overclaims full native FFA or production release');
          console.log('PASS honest real native G5.4 player+soldier candidate, no historic FFA modifications');
          "
      - name: Upload separate S3D1 FPS human 140 soldier HTML
        uses: actions/upload-artifact@v4
        with:
          name: KillTheKing-S3D1-Real-G54-Player-HP-FPS-4-Weapons-140-Soldiers-NOT-Final
          path: |
            recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html
            recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html.build.json
          if-no-files-found: error
  chromium:
    name: Actual Chromium SwiftShader FPS KeyW/F and native 140 player HP
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild true S3D1 source-provenanced candidate
        run: node recovered/siege/build_siege_player_candidate.mjs recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html
      - name: Install pinned Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Real Chromium player walk/shoot/bow/HP/team changes without debug victory
        env:
          KTK_S3D1_REPORT_DIR: recovered/siege/browser-evidence-s3d1
        run: |
          node recovered/siege/browser_siege_player_smoke.mjs \
            recovered/siege/dist/KillTheKing_Kusatma_S3D1_FPS_140_Gercek_Asker_Savas_Aday.html
      - name: Save runtime browser screenshot and exact JSON, also on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KillTheKing-S3D1-Chromium-Real-FPS-Human-SOFTWARE-WebGL-Evidence
          path: recovered/siege/browser-evidence-s3d1/
          if-no-files-found: warn
