name: OPT-09 shadow-pass diagnostic only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opt09_shadow_ab.yml'
      - 'qa/opt09_shadow_ab.mjs'
      - 'tests/opt09-shadow-ab-integrity.test.mjs'
  workflow_dispatch:
jobs:
  shadow-ab:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        map: [arena, meadow, siege]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KTK_MAP: ${{ matrix.map }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node qa/opt09_shadow_ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opt09-shadow-ab-${{ matrix.map }}
          path: opt09-shadow-ab-*.json
          if-no-files-found: warn
