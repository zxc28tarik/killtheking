name: Kill the King - experimental Chromium software WebGL smoke (NOT GPU approval)
on:
  push:
    branches:
      - codex/g54-ffa-army-isolated-launcher
    paths:
      - 'recovered/army/integration/browser_chromium_smoke.mjs'
      - 'recovered/army/integration/player_target_hotfix.mjs'
      - 'recovered/army/integration/build_isolated_launcher.mjs'
      - '.github/workflows/g54_chromium_software_webgl_smoke.yml'
  workflow_dispatch:
jobs:
  chromium-software-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact accepted Oct A5 FFA independently
        uses: actions/checkout@v4
        with:
          ref: codex/a5-meadow-twentyfold-area
          path: ffa-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chromium test module JavaScript syntax before browser setup
        run: node --check recovered/army/integration/browser_chromium_smoke.mjs
      - name: Rebuild pinned A5 source and isolated HTML
        run: |
          python3 ffa-source/tools/build_offline.py --out dist/KillTheKing_Oyna.html
          echo '18dca2a895763f0955566f2fc90651f1ab1a98f86597e399cbac42ac2fc6f15a  ffa-source/dist/KillTheKing_Oyna.html' | sha256sum --check -
          node recovered/army/integration/build_isolated_launcher.mjs ffa-source/dist/KillTheKing_Oyna.html recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html
          echo '6e5cd25ac217d032a190d499c1fb2aac61c5cff1d2a280793caab894c6448ded  recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html' | sha256sum --check -
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {createHash} from "node:crypto";
            const p="recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html";
            const m=JSON.parse(readFileSync(p+".build.json","utf8"));
            const hash=createHash("sha256").update(readFileSync(p)).digest("hex");
            if(hash!==m.launcherSHA256||m.ffaArcherDrawChanged!==true||
               m.ffaPlayerBowUnchanged!==true||
               m.ffaArenaBotArcherWindupSeconds!==0.5||
               m.originalGraphicsAndWeaponsUnchanged!==false)
              throw Error("Candidate SHA256 or approved draw manifest mismatch");
            console.log("Pinned-source candidate integrity PASS",hash);'
      - name: Install Playwright Chromium + software WebGL dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          if command -v google-chrome >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "KTK_CHROME_EXECUTABLE=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Exercise actual FFA + G5.4 iframes with Chromium browser
        env:
          KTK_BROWSER_REPORT_DIR: recovered/army/integration/browser-evidence
        run: |
          node recovered/army/integration/browser_chromium_smoke.mjs recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html
      - name: Archive software-WebGL evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KillTheKing-Chromium-SOFTWARE-WebGL-Evidence-NOT-HARDWARE-ACCEPTANCE
          path: |
            recovered/army/integration/browser-evidence/
            recovered/army/integration/dist/KillTheKing_Birlesik_FFA_Ordu_G5_4_Aday.html.build.json
          if-no-files-found: warn
